<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR — Букет на коробке</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"
    onerror="console.error('A-Frame failed to load')"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"
    onerror="console.error('MindAR script failed to load')"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: transparent;
      touch-action: none;
    }
    a-scene { display: block; width: 100%; height: 100%; }

    #ui {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .glass {
      background: rgba(225, 230, 250, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    #greeting {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 28px;
      border-radius: 30px;
      font-size: 15px;
      color: #fff;
      white-space: nowrap;
      user-select: none;
      transition: opacity 0.5s;
    }
    #greeting.hidden { opacity: 0; }

    #sound-btn {
      position: absolute;
      top: 20px; right: 20px;
      pointer-events: auto;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    #sound-btn.muted { opacity: 0.45; }

    #view-btn {
      position: absolute;
      top: 20px; right: 76px;
      pointer-events: auto;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      display: none;
    }
    #view-btn.show { display: flex; }

    #text-plaque {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 18px;
      color: #8B1538;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
      max-width: 340px;
      width: 90vw;
      user-select: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.6s;
    }
    #text-plaque.show { opacity: 1; }

    #tap-overlay {
      position: fixed; inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.65);
      cursor: pointer;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #tap-overlay.visible { opacity: 1; pointer-events: auto; }
    #tap-overlay .label {
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.3px;
      padding: 14px 36px;
      border-radius: 40px;
    }
    #tap-overlay .sub {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }

    #error-msg {
      position: fixed; inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      color: #fff;
      font-size: 16px;
      padding: 32px;
      text-align: center;
      line-height: 1.6;
    }
    #error-msg.visible { display: flex; }
    #error-msg a { color: #8ab4ff; text-decoration: underline; cursor: pointer; }

    #scan-flash {
      position: fixed; inset: 0;
      z-index: 25;
      pointer-events: none;
      border: 10px solid transparent;
      border-radius: 24px;
      opacity: 0;
      transition: none;
    }
    #scan-flash.fire {
      animation: flashGreen 0.6s ease-out forwards;
    }
    @keyframes flashGreen {
      0%   { border-color: rgba(74, 222, 128, 0.9); opacity: 1; }
      30%  { border-color: rgba(74, 222, 128, 0.8); opacity: 1; }
      100% { border-color: rgba(74, 222, 128, 0); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="tap-overlay" class="visible">
    <div class="label glass">Коснитесь экрана для запуска AR</div>
    <div class="sub">потребуется доступ к камере</div>
  </div>

  <div id="ui">
    <div id="greeting" class="glass">Наведи камеру на коробочку</div>
    <button id="view-btn" class="glass" title="Рассмотреть букет">👁</button>
    <button id="sound-btn" class="muted glass">🔇</button>
    <div id="text-plaque" class="glass">
      Решил, что обычные цветы — это слишком скучно.<br>
      Такой вариант мне кажется более крутым<br>
      чем просто цветы
    </div>
    <div id="error-msg"></div>
    <div id="scan-flash"></div>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="background-music.mp3" type="audio/mpeg" />
  </audio>

  <!-- ========== A-Frame компоненты ========== -->
  <script>
  AFRAME.registerComponent('bouquet-controller', {
    init: function () {
      this.model = null;
      this.phase = 'idle';
      this.startTime = 0;
      this.elapsed = 0;
      this.musicStarted = false;
      this.emerged = false;

      this.el.addEventListener('targetFound', () => {
        if (this.emerged) return;
        this.emerged = true;

        /* зелёная вспышка подтверждения */
        const flash = document.getElementById('scan-flash');
        flash.classList.remove('fire');
        void flash.offsetWidth;
        flash.classList.add('fire');

        /* букет появится через 0.3 сек (пока длится вспышка) */
        setTimeout(() => {
          const modelEl = this.el.querySelector('[gltf-model]');
          if (!modelEl) return;
          this.model = modelEl;
          this.phase = 'emerging';
          this.startTime = performance.now();
          this.elapsed = 0;

          modelEl.object3D.position.set(0, 0.8, 0);
          modelEl.object3D.scale.set(0.001, 0.001, 0.001);
          modelEl.object3D.rotation.set(0, 0, 0);

          if (!this.musicStarted) {
            this.musicStarted = true;
            const a = document.getElementById('bg-music');
            const b = document.getElementById('sound-btn');
            a.play().then(() => { b.innerHTML = '🔊'; b.classList.remove('muted'); }).catch(() => {});
          }

          setTimeout(() => {
            document.getElementById('text-plaque').classList.add('show');
          }, 1200);
          document.getElementById('greeting').classList.add('hidden');
        }, 300);
      });
    },
    tick: function (time, delta) {
      if (this.phase === 'idle' || !this.model) return;
      const dt = delta / 1000;
      this.elapsed += dt;

      if (this.phase === 'emerging') {
        const t = time - this.startTime;
        const dur = 2500;
        const p = Math.min(t / dur, 1);
        const ep = 1 - Math.pow(1 - p, 3);
        this.model.object3D.position.y = 0.8 + 0.2 * ep;
        const sc = easeBackOut(Math.min(p * 1.3, 1));
        const s = 0.8 * sc;
        this.model.object3D.scale.set(s, s, s);
        this.model.object3D.rotation.y = ep * Math.PI * 0.3;
        if (p >= 1) {
          this.phase = 'floating';
          this.model.object3D.position.y = 1.0;
          this.model.object3D.scale.set(0.8, 0.8, 0.8);
          this.model.object3D.rotation.y = 0;
        }
      }
      if (this.phase === 'floating') {
        if (!window.__isViewMode) {
          this.model.object3D.rotation.y += dt * 0.3;
        }
        this.model.object3D.position.y = 1.0 + Math.sin(this.elapsed * 0.9) * 0.04;
      }
    }
  });
  function easeBackOut(t) {
    const c = 1.70158;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  }

  AFRAME.registerComponent('falling-petals', {
    init: function () {
      this.petals = [];
      this.elapsed = 0;
      this.started = false;
      this.el.addEventListener('targetFound', () => {
        if (!this.started) { this.started = true; this.createPetals(); }
      });
    },
    createPetals: function () {
      const T = AFRAME.THREE;
      const colors = [
        '#ffb7c5','#ffc0cb','#ffd6e0','#ffe4e1','#fff0f5',
        '#ffaab8','#ffccd5','#ffdce5','#f8e8f0','#ffc2c2',
      ];
      for (let i = 0; i < 25; i++) {
        const col = colors[Math.floor(Math.random() * colors.length)];
        const c = document.createElement('canvas');
        c.width = 32; c.height = 48;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 32, 48);
        const g = ctx.createRadialGradient(16, 24, 1, 16, 24, 16);
        g.addColorStop(0, col); g.addColorStop(0.7, col);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(16, 24, 10, 18, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(16, 7); ctx.lineTo(16, 41); ctx.stroke();
        const tex = new T.CanvasTexture(c);
        const mat = new T.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false });
        const sp = new T.Sprite(mat);
        const bs = 0.04 + Math.random() * 0.025;
        sp.scale.set(bs, bs * 1.3, 1);
        const angle = Math.random() * Math.PI * 2;
        const rad = 0.15 + Math.random() * 0.65;
        sp.userData = {
          bx: Math.cos(angle) * rad, bz: Math.sin(angle) * rad,
          startY: 0.5 + Math.random() * 0.3,
          swSp: 0.3 + Math.random() * 0.8, swAm: 0.008 + Math.random() * 0.015,
          rotSp: (Math.random() - 0.5) * 0.1, phase: Math.random() * Math.PI * 2,
          life: Math.random() * 4, maxLife: 3.5 + Math.random() * 3,
          bsx: sp.scale.x, bsy: sp.scale.y,
        };
        sp.position.set(sp.userData.bx, sp.userData.startY, sp.userData.bz);
        sp.material.rotation = Math.random() * Math.PI * 2;
        this.el.object3D.add(sp);
        this.petals.push(sp);
      }
    },
    tick: function (time, delta) {
      if (!this.started) return;
      const dt = delta / 1000;
      this.elapsed += dt;
      this.petals.forEach((sp) => {
        const u = sp.userData;
        u.life += dt;
        const prog = u.life / u.maxLife;
        sp.position.y = u.startY - Math.min(prog * 1.6, 1) * u.startY * 1.8;
        sp.position.x = u.bx + Math.sin(this.elapsed * u.swSp + u.phase) * u.swAm;
        sp.material.rotation += u.rotSp * dt * 10;
        const fi = Math.min(prog / 0.12, 1);
        const fo = Math.max(0, Math.min((1 - prog) / 0.12, 1));
        sp.material.opacity = Math.min(fi, fo);
        const scl = 0.85 + Math.sin(this.elapsed * 2.5 + u.phase) * 0.15;
        sp.scale.x = u.bsx * scl;
        sp.scale.y = u.bsy * scl;
        if (sp.position.y < -0.25 || prog >= 1) {
          const ang = Math.random() * Math.PI * 2;
          const rad = 0.15 + Math.random() * 0.65;
          u.bx = Math.cos(ang) * rad; u.bz = Math.sin(ang) * rad;
          u.startY = 0.5 + Math.random() * 0.3;
          u.swSp = 0.3 + Math.random() * 0.8; u.swAm = 0.008 + Math.random() * 0.015;
          u.rotSp = (Math.random() - 0.5) * 0.1; u.phase = Math.random() * Math.PI * 2;
          u.life = 0;
          sp.position.set(u.bx, u.startY, u.bz);
          sp.material.rotation = Math.random() * Math.PI * 2;
          sp.material.opacity = 0;
          sp.scale.set(u.bsx, u.bsy, 1);
        }
      });
    }
  });
  </script>

  <!-- ========== СЦЕНА ========== -->
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; filterMinCF: 0.5; filterBeta: 0.3; missTolerance: 5; warmupTolerance: 5;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0"
      bouquet-controller
      falling-petals
    >
      <a-entity
        position="0 0.8 0"
        scale="0 0 0"
        gltf-model="url(rose-bouquet.glb)"
      ></a-entity>
    </a-entity>
  </a-scene>

  <!-- ========== ЛОГИКА ========== -->
  <script>
  (function () {
    const audio = document.getElementById('bg-music');
    const soundBtn = document.getElementById('sound-btn');
    const viewBtn = document.getElementById('view-btn');
    const errorMsg = document.getElementById('error-msg');
    const tapOverlay = document.getElementById('tap-overlay');
    const markerEl = document.querySelector('[mindar-image-target]');
    let isPlaying = false;
    let isViewMode = false;
    let dragModel = null;
    let isDragging = false;
    let lastTouch = null;

    window.__isViewMode = false;

    /* ——— звук ——— */
    soundBtn.addEventListener('click', () => {
      if (isPlaying) { audio.pause(); soundBtn.innerHTML = '🔇'; soundBtn.classList.add('muted'); }
      else { audio.play().then(() => { soundBtn.innerHTML = '🔊'; soundBtn.classList.remove('muted'); }).catch(() => {}); }
      isPlaying = !isPlaying;
    });

    /* ——— вращение пальцами ——— */
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && dragModel) {
        isDragging = true;
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging || !lastTouch || !dragModel) return;
      const dx = e.touches[0].clientX - lastTouch.x;
      const dy = e.touches[0].clientY - lastTouch.y;
      dragModel.rotation.y += dx * 0.012;
      dragModel.rotation.x += dy * 0.006;
      dragModel.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, dragModel.rotation.x));
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });

    document.addEventListener('touchend', () => {
      isDragging = false;
      lastTouch = null;
    }, { passive: true });

    /* ——— показываем кнопку просмотра при нахождении маркера ——— */
    markerEl.addEventListener('targetFound', () => {
      document.getElementById('greeting').classList.add('hidden');
      viewBtn.classList.add('show');
      const modelEl = document.querySelector('[gltf-model]');
      if (modelEl) dragModel = modelEl.object3D;
    });

    /* ——— кнопка "рассмотреть букет" (камера выкл) ——— */
    viewBtn.addEventListener('click', () => {
      if (isViewMode) return;
      isViewMode = true;
      window.__isViewMode = true;
      viewBtn.style.display = 'none';

      const scene = document.querySelector('a-scene');
      const T = AFRAME.THREE;

      /* останавливаем MindAR */
      const sys = scene.systems && scene.systems['mindar-image-system'];
      if (sys) {
        sys.pause();
        if (sys.video && sys.video.srcObject) {
          sys.video.srcObject.getTracks().forEach(t => t.stop());
        }
      }

      const modelEl = document.querySelector('[gltf-model]');
      if (!modelEl) return;
      const root = modelEl.object3D;

      /* текущая мировая позиция */
      const worldPos = new T.Vector3();
      root.getWorldPosition(worldPos);

      /* открепляем от маркера */
      const parent = root.parent;
      if (parent) parent.remove(root);

      /* крепим к камере — букет всегда перед ней */
      const camera = document.querySelector('[camera]');
      if (!camera) return;
      const cam = camera.object3D;

      /* начальная позиция в координатах камеры */
      const localStart = cam.worldToLocal(worldPos);
      cam.add(root);
      root.position.copy(localStart);
      root.quaternion.identity();
      root.scale.set(0.8, 0.8, 0.8);

      /* анимация переезда в центр */
      const targetPos = new T.Vector3(0, 0.15, -0.8);
      const startPos = root.position.clone();
      const t0 = performance.now();
      const dur = 800;

      function tickCenter() {
        const t = Math.min((performance.now() - t0) / dur, 1);
        const e = 1 - Math.pow(1 - t, 3);
        root.position.lerpVectors(startPos, targetPos, e);
        if (t < 1) requestAnimationFrame(tickCenter);
      }
      tickCenter();
    });

    /* ——— запуск AR ——— */
    tapOverlay.addEventListener('click', function startHandler() {
      tapOverlay.classList.remove('visible');

      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then((stream) => {
          stream.getTracks().forEach(t => t.stop());
          return startMindAR();
        })
        .then(() => {
          console.log('AR started OK');
        })
        .catch((err) => {
          console.error('AR error:', err);
          errorMsg.className = 'visible';
          errorMsg.innerHTML =
            'Ошибка камеры.<br><br>' +
            '• разрешите доступ к камере в Safari<br>' +
            '• убедитесь, что сайт открыт по HTTPS<br><br>' +
            '<span style="font-size:13px;color:rgba(255,255,255,0.4)">' +
            (err.message || err) + '</span><br><br>' +
            '<a onclick="location.reload()">Повторить</a>';
        });
    }, { once: true });

    /* ——— запускает MindAR ——— */
    function startMindAR() {
      return new Promise((resolve, reject) => {
        const scene = document.querySelector('a-scene');

        const onReady = () => { cleanup(); resolve(); };
        const onError = (e) => { cleanup(); reject(e.detail.error || e); };
        const cleanup = () => {
          scene.removeEventListener('arReady', onReady);
          scene.removeEventListener('arError', onError);
        };
        scene.addEventListener('arReady', onReady);
        scene.addEventListener('arError', onError);

        let tries = 0;
        const poll = () => {
          const comp = scene.components && scene.components['mindar-image'];
          if (comp && comp.constructor && typeof comp.start === 'function') {
            comp.start();
            return;
          }

          const sys = scene.systems && scene.systems['mindar-image-system'];
          if (sys && sys.constructor && typeof sys.start === 'function') {
            sys.setup({
              imageTargetSrc: 'targets.mind',
              maxTrack: 1,
              showStats: false,
              uiLoading: 'yes',
              uiScanning: 'yes',
              uiError: 'yes',
              missTolerance: 5,
              warmupTolerance: 5,
              filterMinCF: 0.5,
              filterBeta: 0.3
            });
            sys.start();
            return;
          }

          if (++tries > 60) {
            cleanup();
            const reg = !!(AFRAME.components && AFRAME.components['mindar-image']);
            const sysReg = !!(AFRAME.systems && AFRAME.systems['mindar-image-system']);
            reject(new Error(!reg && !sysReg
              ? 'MindAR скрипт не загрузился (проверьте CDN)'
              : 'MindAR не может инициализироваться'));
            return;
          }
          setTimeout(poll, 100);
        };

        if (scene.hasLoaded) { poll(); }
        else { scene.addEventListener('loaded', poll, { once: true }); }
      });
    }

  })();
  </script>
</body>
</html>
