<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR — Букет на коробке</title>

  <!-- Three.js (должен быть загружен ДО mindar-image-three) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js" onerror="window._scriptFail='three'"></script>
  <!-- GLTFLoader -->
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="window._scriptFail='gltf'"></script>
  <!-- MindAR core -->
  <script src="https://unpkg.com/mind-ar@1.2.2/dist/mindar-image.prod.js" onerror="window._scriptFail='mindar-core'"></script>
  <!-- MindAR Three.js интеграция (использует window.THREE, поэтому после three.js) -->
  <script src="https://unpkg.com/mind-ar@1.2.2/dist/mindar-image-three.prod.js" onerror="window._scriptFail='mindar-three'"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      touch-action: none;
    }
    canvas { display: block; }

    #ui {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .glass {
      background: rgba(225, 230, 250, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    #greeting {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 28px;
      border-radius: 30px;
      font-size: 15px;
      color: #fff;
      white-space: nowrap;
      user-select: none;
      transition: opacity 0.5s;
    }
    #greeting.hidden { opacity: 0; }

    #sound-btn {
      position: absolute;
      top: 20px; right: 20px;
      pointer-events: auto;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    #sound-btn.muted { opacity: 0.45; }

    #text-plaque {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 18px;
      color: #8B1538;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
      max-width: 340px;
      width: 90vw;
      user-select: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.6s;
    }
    #text-plaque.show { opacity: 1; }

    /* ——— tap overlay ——— */
    #tap-overlay {
      position: fixed; inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.65);
      cursor: pointer;
      flex-direction: column;
      gap: 12px;
    }
    #tap-overlay.visible { display: flex; }
    #tap-overlay .label {
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.3px;
      padding: 14px 36px;
      border-radius: 40px;
    }
    #tap-overlay .sub {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }

    #error-msg {
      position: fixed; inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      color: #fff;
      font-size: 16px;
      padding: 32px;
      text-align: center;
      line-height: 1.6;
    }
    #error-msg.visible { display: flex; }
    #error-msg a { color: #8ab4ff; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>

  <div id="tap-overlay">
    <div class="label glass">Коснитесь экрана для запуска AR</div>
    <div class="sub">потребуется доступ к камере</div>
  </div>

  <div id="ui">
    <div id="greeting" class="glass">Наведи камеру на коробочку</div>
    <button id="sound-btn" class="muted glass">🔇</button>
    <div id="text-plaque" class="glass">
      Решил, что обычные цветы — это слишком скучно.<br>
      Такой вариант мне кажется более крутым<br>
      чем просто цветы
    </div>
    <div id="error-msg"></div>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="background-music.mp3" type="audio/mpeg" />
  </audio>

  <script>
  (async function () {
    if (!window.THREE || !window.MindAR || !window.MindAR.MindARThree) {
      const fail = window._scriptFail || 'unknown';
      const names = {
        three: 'Three.js',
        gltf: 'GLTFLoader',
        'mindar-core': 'MindAR core',
        'mindar-three': 'MindAR Three.js',
      };
      document.getElementById('error-msg').className = 'visible';
      document.getElementById('error-msg').innerHTML =
        'Не загрузился: <b>' + (names[fail] || fail) + '</b><br><br>' +
        '• отключите Adblock / контент-блокировщик<br>' +
        '• попробуйте Chrome вместо Safari<br>' +
        '• проверьте интернет<br><br>' +
        '<a onclick="location.reload()">Повторить</a>';
      return;
    }
    const THREE = window.THREE;
    const { MindARThree } = window.MindAR;

    const greeting = document.getElementById('greeting');
    const textPlaque = document.getElementById('text-plaque');
    const soundBtn = document.getElementById('sound-btn');
    const audio = document.getElementById('bg-music');
    const errorMsg = document.getElementById('error-msg');
    const tapOverlay = document.getElementById('tap-overlay');
    let isPlaying = false;
    let musicStarted = false;
    let wasVisible = false;
    let emergePhase = 'idle';
    let emergeStart = 0;
    let emergeElapsed = 0;
    let petals = [];
    let petalElapsed = 0;
    let petalsStarted = false;
    let started = false;

    soundBtn.addEventListener('click', () => {
      if (isPlaying) { audio.pause(); soundBtn.innerHTML = '🔇'; soundBtn.classList.add('muted'); }
      else { audio.play().then(() => { soundBtn.innerHTML = '🔊'; soundBtn.classList.remove('muted'); }).catch(() => {}); }
      isPlaying = !isPlaying;
    });

    /* ——— MindAR ——— */
    let mindarThree, renderer, scene, camera, anchor, modelGroup;

    function setupScene() {
      mindarThree = new MindARThree({ imageTargetSrc: 'targets.mind' });
      renderer = mindarThree.renderer;
      scene = mindarThree.scene;
      camera = mindarThree.camera;

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.prepend(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const ml = new THREE.DirectionalLight(0xffffff, 1.8);
      ml.position.set(2, 5, 3);
      scene.add(ml);
      scene.add(new THREE.DirectionalLight(0xaaccff, 0.6).position.set(-2, 2, -2));
      scene.add(new THREE.DirectionalLight(0xffffff, 0.3).position.set(0, -1, -4));

      anchor = mindarThree.addAnchor(0);
      modelGroup = new THREE.Group();
      modelGroup.position.set(0, -0.08, 0);
      modelGroup.scale.set(0.001, 0.001, 0.001);
      anchor.group.add(modelGroup);

      const loader = new THREE.GLTFLoader();
      loader.load('rose-bouquet.glb', (gltf) => {
        const model = gltf.scene;
        const bx = new THREE.Box3().setFromObject(model);
        const center = bx.getCenter(new THREE.Vector3());
        const size = bx.getSize(new THREE.Vector3());
        model.position.sub(center);
        const sc = 0.65 / Math.max(size.x, size.y, size.z);
        model.scale.set(sc, sc, sc);
        model.position.y += size.y * sc * 0.5;
        modelGroup.add(model);
      }, undefined, (err) => console.error('model:', err));

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });
    }

    function createPetals() {
      const colors = [
        '#ffb7c5','#ffc0cb','#ffd6e0','#ffe4e1','#fff0f5',
        '#ffaab8','#ffccd5','#ffdce5','#f8e8f0','#ffc2c2',
      ];
      for (let i = 0; i < 25; i++) {
        const col = colors[Math.floor(Math.random() * colors.length)];
        const c = document.createElement('canvas');
        c.width = 32; c.height = 48;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 32, 48);
        const g = ctx.createRadialGradient(16, 24, 1, 16, 24, 16);
        g.addColorStop(0, col); g.addColorStop(0.7, col);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(16, 24, 10, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(16, 7); ctx.lineTo(16, 41);
        ctx.stroke();
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false });
        const sp = new THREE.Sprite(mat);
        const bs = 0.04 + Math.random() * 0.025;
        sp.scale.set(bs, bs * 1.3, 1);
        const angle = Math.random() * Math.PI * 2;
        const rad = 0.15 + Math.random() * 0.65;
        sp.userData = {
          bx: Math.cos(angle) * rad, bz: Math.sin(angle) * rad,
          startY: 0.5 + Math.random() * 0.3,
          swSp: 0.3 + Math.random() * 0.8, swAm: 0.008 + Math.random() * 0.015,
          rotSp: (Math.random() - 0.5) * 0.1, phase: Math.random() * Math.PI * 2,
          life: Math.random() * 4, maxLife: 3.5 + Math.random() * 3,
          bsx: sp.scale.x, bsy: sp.scale.y,
        };
        sp.position.set(sp.userData.bx, sp.userData.startY, sp.userData.bz);
        sp.material.rotation = Math.random() * Math.PI * 2;
        anchor.group.add(sp);
        petals.push(sp);
      }
    }

    /* ——— запуск AR ——— */
    function startAR() {
      if (started) return;
      started = true;
      tapOverlay.classList.remove('visible');

      setupScene();

      console.log('starting AR...');

      mindarThree.start().then(() => {
        console.log('AR started OK');
        animate();
      }).catch((err) => {
        console.error('AR start failed:', err);
        errorMsg.className = 'visible';
        errorMsg.innerHTML =
          'Ошибка камеры.<br><br>' +
          '• разрешите доступ к камере в Safari<br>' +
          '• убедитесь, что сайт открыт по HTTPS<br>' +
          '<br><span style="font-size:13px;color:rgba(255,255,255,0.4)">' +
          (err.message || err) + '</span><br><br>' +
          '<a onclick="location.reload()">Повторить</a>';
      });
    }

    /* ——— Пробуем автостарт (сработает если есть жест) ——— */
    function tryAutoStart() {
      tapOverlay.classList.add('visible');

      /* На iOS getUserMedia обязательно требует жест пользователя.
         Показываем оверлей, стартуем по клику */
      tapOverlay.addEventListener('click', startAR, { once: true });
      tapOverlay.addEventListener('touchend', startAR, { once: true });
    }

    /* ——— Render loop ——— */
    function easeBackOut(t) {
      const c = 1.70158;
      return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();
      const now = performance.now();

      /* emergence on target found */
      if (anchor.visible && !wasVisible) {
        wasVisible = true;
        emergePhase = 'emerging';
        emergeStart = now;
        emergeElapsed = 0;
        modelGroup.position.set(0, -0.08, 0);
        modelGroup.scale.set(0.001, 0.001, 0.001);
        modelGroup.rotation.set(0, 0, 0);

        if (!musicStarted) {
          musicStarted = true;
          audio.play().then(() => {
            soundBtn.innerHTML = '🔊';
            soundBtn.classList.remove('muted');
          }).catch(() => {});
        }

        setTimeout(() => textPlaque.classList.add('show'), 1200);
        greeting.classList.add('hidden');

        if (!petalsStarted) {
          petalsStarted = true;
          createPetals();
        }
      }
      if (!anchor.visible) wasVisible = false;

      /* emergence animation */
      if (emergePhase === 'emerging') {
        const t = now - emergeStart;
        const dur = 2500;
        const p = Math.min(t / dur, 1);
        const ep = 1 - Math.pow(1 - p, 3);
        modelGroup.position.y = -0.08 + 0.23 * ep;
        const sc = easeBackOut(Math.min(p * 1.3, 1));
        const s = 0.3 * sc;
        modelGroup.scale.set(s, s, s);
        modelGroup.rotation.y = ep * Math.PI * 0.3;
        if (p >= 1) {
          emergePhase = 'floating';
          emergeElapsed = 0;
          modelGroup.position.y = 0.15;
          modelGroup.scale.set(0.3, 0.3, 0.3);
          modelGroup.rotation.y = 0;
        }
      }

      if (emergePhase === 'floating') {
        emergeElapsed += dt;
        modelGroup.rotation.y += dt * 0.3;
        modelGroup.position.y = 0.15 + Math.sin(emergeElapsed * 0.9) * 0.04;
      }

      /* petals */
      if (petalsStarted) {
        petalElapsed += dt;
        petals.forEach((sp) => {
          const u = sp.userData;
          u.life += dt;
          const prog = u.life / u.maxLife;
          sp.position.y = u.startY - Math.min(prog * 1.6, 1) * u.startY * 1.8;
          sp.position.x = u.bx + Math.sin(petalElapsed * u.swSp + u.phase) * u.swAm;
          sp.material.rotation += u.rotSp * dt * 10;
          const fi = Math.min(prog / 0.12, 1);
          const fo = Math.max(0, Math.min((1 - prog) / 0.12, 1));
          sp.material.opacity = Math.min(fi, fo);
          const scl = 0.85 + Math.sin(petalElapsed * 2.5 + u.phase) * 0.15;
          sp.scale.x = u.bsx * scl;
          sp.scale.y = u.bsy * scl;
          if (sp.position.y < -0.25 || prog >= 1) {
            const ang = Math.random() * Math.PI * 2;
            const rad = 0.15 + Math.random() * 0.65;
            u.bx = Math.cos(ang) * rad;
            u.bz = Math.sin(ang) * rad;
            u.startY = 0.5 + Math.random() * 0.3;
            u.swSp = 0.3 + Math.random() * 0.8;
            u.swAm = 0.008 + Math.random() * 0.015;
            u.rotSp = (Math.random() - 0.5) * 0.1;
            u.phase = Math.random() * Math.PI * 2;
            u.life = 0;
            sp.position.set(u.bx, u.startY, u.bz);
            sp.material.rotation = Math.random() * Math.PI * 2;
            sp.material.opacity = 0;
            sp.scale.set(u.bsx, u.bsy, 1);
          }
        });
      }

      mindarThree.update();
      renderer.render(scene, camera);
    }

    /* ——— Старт ——— */
    tryAutoStart();
  })();
  </script>
</body>
</html>
